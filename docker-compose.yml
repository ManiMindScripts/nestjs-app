services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    ports:
      - "3001:3000"
    # Single canonical env file (.env). Everything shared lives there; only the
    # values that are inherently different in a Docker network - service
    # hostnames, container-internal ports, the runtime mode and the entrypoint
    # migrate/seed switches - are overridden inline below. No duplicated .env.
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MAIL_HOST: mailpit
      # Entrypoint switches: migrate + seed on first container start.
      MIGRATE_ON_START: 'true'
      SEED_ON_START: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d my_app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD","redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
